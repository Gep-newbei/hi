<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Penis</title>
    <style>
      body{
        display:flex;
        min-height:100vh;
        overflow:hidden;
        overflow-x: hidden;
        align-items:center;
        justify-content:center;
      }
      .pBody{
        position: relative;
        width:210px;
        height: 550px;
        border-radius: 45% 45% 0% 0% / 45% 45% 0% 0%;
        background-color:pink;
      }
      .pHole{ 
        text-align: center;
        position:absolute;
        width:7px;
        height:20px;
        background-color:black;
        left:49%;
        border-radius: % 45% 0% 0% / 45% 45% 0% 0%;
      }
      .pFinger1, .pFinger2, .pFinger3, .pFinger4, .pThumb{
        position: absolute;
        background-color: brown;
        width:150px;
        height: 45px;
        animation-name: up;
        animation-duration: 1.2s;
        animation-iteration-count:infinite;
        border-top-right-radius:35%;
        border-bottom-right-radius:35%;
        border-top-left-radius:10%;
        border-bottom-left-radius:10%;
      }
      .pFingerCont{
        position:relative;
        z-index: 1;
      }
      .pPalm{
        position:absolute;
        width:100px;
        height:200px;
        top:55%;
        left:70%;
        z-index:-1;
        background-color:brown;
        border-radius:0% 50% 50% 0% / 0% 50% 50% 0;
        animation-name: upp;
        animation-duration: 1.2s;
        animation-iteration-count:infinite;
      }
      .pThumb{
        width:150px;
        height:60px;
        top:49%; 
        left:49%;
        transform: rotate(45deg);
        border-top-left-radius:50%;
        border-bottom-right-radius:0%;
      }
      .pFinger1{top:53%;left:14%;}
      .pFinger2{top:61%;left:14%;}
      .pFinger3{top:69%;left:14%;}
      .pFinger4{top:77%;left:14%;}
      @keyframes up{
        50%{transform:translateY(200%)}
      }
      @keyframes upp{
        50%{transform:translateY(40%)}
      }
      
    </style>
  </head>
  <body>
    <div class="pBody">
      <div class="pHole"></div>
    </div>
    <div class="pFingerCont"></div>
      <div class="pFinger1"></div>
      <div class="pFinger2"></div>
      <div class="pFinger3"></div>
      <div class="pFinger4"></div>
      <div class="pPalm"></div>
      <div class="pThumb"></div>
    </div>
  </body>
</html>
